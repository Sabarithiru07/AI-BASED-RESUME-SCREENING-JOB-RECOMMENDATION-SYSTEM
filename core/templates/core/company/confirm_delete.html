{% extends "core/base.html" %}
{% block page_title %}Delete Job{% endblock %}
{% block content %}
<div style="max-width:500px;margin:60px auto;">
  <div class="card" style="text-align:center;padding:40px;">
    <div style="font-size:52px;margin-bottom:16px;">⚠️</div>
    <h2 style="font-family:'Syne',sans-serif;font-size:22px;margin-bottom:8px;">Delete This Job?</h2>
    <p style="color:var(--text3);margin-bottom:6px;">You are about to permanently delete:</p>
    <p style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:#ef4444;margin-bottom:20px;">{{ job.title }}</p>
    <p style="color:var(--text3);font-size:13px;margin-bottom:28px;">This will also delete all associated applications. This action cannot be undone.</p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <a href="{% url 'company_jobs' %}" class="btn btn-outline">Cancel</a>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
