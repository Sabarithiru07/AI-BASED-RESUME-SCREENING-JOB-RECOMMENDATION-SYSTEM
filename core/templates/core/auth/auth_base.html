{% extends "core/base.html" %}
{% block public_content %}
<style>
  body { background: #080c14; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .auth-wrap { width: 100%; max-width: 440px; padding: 20px; }
  .auth-logo { text-align: center; margin-bottom: 32px; }
  .auth-logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg,#3b82f6,#6366f1); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 12px; }
  .auth-logo-text { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; }
  .auth-card { background: #111827; border: 1px solid #1e2d45; border-radius: 18px; padding: 36px; }
  .auth-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .auth-sub { color: #64748b; font-size: 14px; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-control { width: 100%; background: #0d1220; border: 1px solid #1e2d45; border-radius: 10px; padding: 12px 14px; color: #e2e8f0; font-size: 14px; font-family: 'DM Sans',sans-serif; transition: all 0.2s; }
  .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  .form-control::placeholder { color: #475569; }
  .btn-submit { width: 100%; background: linear-gradient(135deg,#3b82f6,#6366f1); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; font-family: 'DM Sans',sans-serif; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
  .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
  .auth-footer { text-align: center; margin-top: 20px; color: #64748b; font-size: 14px; }
  .auth-footer a { color: #3b82f6; font-weight: 600; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .errlist { color: #f87171; font-size: 12px; margin-top: 4px; list-style: none; }
  .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; border: 1px solid rgba(239,68,68,0.3); background: rgba(239,68,68,0.1); color: #f87171; }
</style>
<div class="auth-wrap">
  <div class="auth-logo">
    <div class="auth-logo-icon">🧠</div>
    <div class="auth-logo-text">TalentAI</div>
  </div>
  <div class="auth-card">
    <div class="auth-title">{% block auth_title %}Welcome{% endblock %}</div>
    <div class="auth-sub">{% block auth_sub %}{% endblock %}</div>
    {% for msg in messages %}
    <div class="alert">{{ msg }}</div>
    {% endfor %}
    {% block auth_form %}{% endblock %}
  </div>
  <div class="auth-footer">{% block auth_footer %}{% endblock %}</div>
</div>
{% endblock %}
